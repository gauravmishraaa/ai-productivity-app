spring.application.name=ai-productivity-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_productivity_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.ai.google.genai.chat.enabled=false
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.model.chat=ollama
# Spring AI JDBC Chat Memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always